<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Brushed metal face with radial gradient -->
  <defs>
    <radialGradient id="metalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#404050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#202028;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="56" fill="url(#metalGrad)" stroke="#00ffe0" stroke-width="1"/>
  <!-- Concentric groove rings for depth -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#101018" stroke-width="0.5" opacity="0.6"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#303040" stroke-width="0.5" opacity="0.4"/>
</svg>
